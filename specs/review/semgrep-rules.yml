# Offline Semgrep rules for the phone-queue branch (no registry download). Run:
#   semgrep scan --config specs/review/semgrep-rules.yml --metrics=off server/node src/ts
rules:
  - id: log-user-input-unsanitized
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Request data goes into a log line. A CR/LF in it forges extra log lines. Strip control characters first.
    patterns:
      - pattern-either:
          - pattern: console.log(..., $REQ.query.$X, ...)
          - pattern: console.log(..., $REQ.body.$X, ...)
          - pattern: console.log(`...${$REQ.query.$X}...`)
          - pattern: console.log(`...${String($REQ.query.$X)}...`)
          - pattern: console.log(`...${String($REQ.query.$X || '')}...`)
          - pattern: console.log(`...${String($REQ.query.$X || '').slice(...)}...`)
    paths:
      include: ["server/node/*.cjs"]

  - id: redirect-to-host-header
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A redirect target built from the Host header (or something derived from it) is an open redirect: the client chooses where it goes.
    pattern-either:
      - pattern: lanRedirectTarget($HOST, ...)
      - pattern: res.redirect($CODE, $URL)
    paths:
      include: ["server/node/*.cjs"]

  - id: promise-that-never-settles
    languages: [javascript, typescript]
    severity: INFO
    message: "A promise that never settles parks the caller for good; make sure that is intended (here, waiting for a reload)."
    pattern: new Promise(() => {})

  - id: unauthenticated-route
    languages: [javascript]
    severity: INFO
    message: "Route with no auth middleware or checkAuth call in the same file region. Confirm it exposes nothing and is bounded."
    pattern-either:
      - pattern: app.get('/__client-log', ...)
      - pattern: app.get('/', ...)
    paths:
      include: ["server/node/*.cjs"]

  - id: empty-catch-swallows-error
    languages: [javascript, typescript]
    severity: INFO
    message: "An empty catch hides failures. Fine for best-effort telemetry, wrong for anything that changes state."
    pattern: |
      try { ... } catch { }
    paths:
      include: ["src/ts/**", "server/node/*.cjs"]

  - id: sql-built-from-a-variable
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An SQL string is built from a variable. Use a prepared statement with ? placeholders; a key or a file name in SQL text is an injection.
    pattern-either:
      - pattern: $DB.exec(`...${$X}...`)
      - pattern: $DB.exec($A + $B)
      - pattern: $DB.prepare(`...${$X}...`)
      - pattern: $DB.prepare($A + $B)
    paths:
      include: ["server/node/*.cjs"]

  - id: file-write-in-place-in-the-save-api
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      fs.writeFile / writeFileSync on a file other code reads concurrently truncates it first: a reader or a crash sees a half file.
      Use atomicWriteFile (temp file + rename), see specs/core/SaveLoad.tla.
    pattern-either:
      - pattern: fs.writeFile($P, ...)
      - pattern: fs.writeFileSync($P, ...)
      - pattern: writeFileSync($P, ...)
    paths:
      include: ["server/node/saveQueue.cjs", "server/node/atomicWrite.cjs"]


  - id: mutate-stored-card-in-map
    languages: [typescript]
    severity: ERROR
    message: >-
      This writes into the character's own stored list while mapping it. The card in the database changes on every call, and each
      change re-runs the autosave's walk of the whole card (saveWatch.svelte.ts); runLuaEditTrigger and runTrigger did this per rendered
      chunk (258 card walks in one turn, specs/core/SaveWatch.dfy C). Map to a copy: `.map((v) => ({ ...v, flag }))`.
    patterns:
      - pattern: $V.$F = $X
      - pattern-inside: $C.$LIST.map(($V) => {...})
      - metavariable-regex:
          metavariable: $LIST
          regex: ^(triggerscript|customscripts|globalLore)$
    paths:
      include: ["**/src/ts/**"]
